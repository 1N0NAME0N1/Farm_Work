name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Cancel stale Pages deployment
        uses: actions/github-script@v7
        continue-on-error: true
        with:
          script: |
            const { owner, repo } = context.repo;
            await github.request('POST /repos/{owner}/{repo}/pages/deployments/{pages_deployment_id}/cancel', { owner, repo, pages_deployment_id: 'adba5a9895c024e8e6fdcce1ede579caaf760a27' });
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
